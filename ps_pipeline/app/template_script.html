<script>
const EMBED = /*__DATA__*/;
let D = JSON.parse(JSON.stringify(EMBED));
let SEL = 'LHT';
const $ = id => document.getElementById(id);
const C = {navy:'#21295C', ocean:'#065A82', teal:'#1C7293', orange:'#F18F01', slate:'#5A6C7D', mist:'#DDE7EE'};
const charts = {};
const fmt = (v, d=1) => (v===null||v===undefined||Number.isNaN(v)) ? '—' : (typeof v==='number' ? v.toLocaleString(undefined,{minimumFractionDigits:d, maximumFractionDigits:d}) : v);
const sign = (v, d=2) => (v>0?'+':'') + fmt(v,d);
const spName = k => (D.species.find(s=>s.species_code===k)||{}).common || k;
const byCode = (arr, k) => arr.find(r=>r.species_code===k);

/* ---------------- numerics ------------------------------------------------ */
function lgamma(x){ const g=7, p=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x))-lgamma(1-x); x-=1; let a=p[0]; const t=x+g+0.5; for(let i=1;i<9;i++) a+=p[i]/(x+i); return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a); }
function betacf(a,b,x){ const MAXIT=300, EPS=3e-14, FPMIN=1e-300; let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap; if(Math.abs(d)<FPMIN)d=FPMIN; d=1/d; let h=d;
  for(let m=1;m<=MAXIT;m++){ const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<EPS)break; } return h; }
function betainc(a,b,x){ if(x<=0)return 0; if(x>=1)return 1; const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return (x<(a+1)/(a+b+2)) ? bt*betacf(a,b,x)/a : 1-bt*betacf(b,a,1-x)/b; }
function gammainc(a,x){ if(x<=0)return 0; if(x<a+1){ let ap=a,sum=1/a,del=sum; for(let n=1;n<400;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*3e-14)break;} return sum*Math.exp(-x+a*Math.log(x)-lgamma(a)); }
  let b=x+1-a,c=1/1e-300,d=1/b,h=d; for(let i=1;i<400;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-14)break;} return 1-Math.exp(-x+a*Math.log(x)-lgamma(a))*h; }
const median = a => { const s=[...a].sort((x,y)=>x-y), n=s.length; return n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; };
const quantile = (a,q) => { const s=[...a].sort((x,y)=>x-y), pos=(s.length-1)*q, lo=Math.floor(pos), hi=Math.ceil(pos); return s[lo]+(s[hi]-s[lo])*(pos-lo); };
const mean = a => a.reduce((s,v)=>s+v,0)/a.length;
const variance = a => { const m=mean(a); return a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1); };
function madZ(h,c){ const md=median(h); let mad=median(h.map(v=>Math.abs(v-md)))*1.4826; if(mad===0) mad=Math.sqrt(variance(h))||1; return (c-md)/mad; }
const pctRank = (h,c) => 100*h.filter(v=>v<c).length/h.length;
function gammaPrior(h, overdisp=true, weight=1){ const m=mean(h), v=variance(h); let shape, rate;
  if(overdisp && v>m*1.05){ shape=m*m/(v-m); rate=m/(v-m); } else { shape=h.reduce((s,x)=>s+x,0); rate=h.length; } return {shape:shape*weight, rate:rate*weight}; }
const nbTail = (shape,rate,k) => k<=0 ? 1 : 1-betainc(shape,k,rate/(rate+1));        // P(X >= k)
function nbPMF(shape,rate,k){ const p=rate/(rate+1); return Math.exp(lgamma(k+shape)-lgamma(k+1)-lgamma(shape)+shape*Math.log(p)+k*Math.log(1-p)); }
function nbQuantile(shape,rate,q){ let cum=0,k=0; while(cum<q && k<1e6){ cum+=nbPMF(shape,rate,k); if(cum>=q)return k; k++; } return k; }

/* ---------------- shell -------------------------------------------------- */
const techToggle=$('techToggle'); try{ techToggle.checked = localStorage.getItem('ps_showtech')==='1'; }catch(e){}
document.body.classList.toggle('showtech', techToggle.checked);
techToggle.addEventListener('change',()=>{ document.body.classList.toggle('showtech', techToggle.checked); try{ localStorage.setItem('ps_showtech', techToggle.checked?'1':'0'); }catch(e){} });
function goTab(name){ document.querySelector(`#nav .step[data-tab=${name}]`).click(); window.scrollTo({top:0}); }
document.querySelectorAll('#nav .step').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#nav .step').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id==='tab-'+b.dataset.tab));
  if(b.dataset.tab==='home') renderHome(); if(b.dataset.tab==='anomaly') renderAnomaly(); if(b.dataset.tab==='export') renderExport(); if(b.dataset.tab==='bayes') renderBayes(); if(b.dataset.tab==='agent') renderAgent(); if(b.dataset.tab==='causal') renderCausal();
}));
function table(id, cols, rows, opts={}){ const t=$(id); const th='<tr>'+cols.map(c=>`<th class="${c.num?'num':''}">${c.h}</th>`).join('')+'</tr>';
  const body=rows.map(r=> r.__group ? `<tr class="grp"><td colspan="${cols.length}">${r.__group}</td></tr>` :
    '<tr>'+cols.map(c=>{ let v=c.f? c.f(r) : r[c.k]; if(typeof v==='number' && c.d!==undefined) v=fmt(v,c.d); if(v===null||v===undefined) v='—'; return `<td class="${c.num?'num':''} ${c.sp?'sp':''}">${v}</td>`; }).join('')+'</tr>').join('');
  t.innerHTML=th+body; }
function download(name, text, type='text/plain'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); }
function toCSV(rows){ if(!rows.length) return ''; const k=Object.keys(rows[0]).filter(x=>typeof rows[0][x]!=='object'); return k.join(',')+'\n'+rows.map(r=>k.map(c=>JSON.stringify(r[c]??'')).join(',')).join('\n'); }
function chart(id, cfg){ if(!window.Chart){ const cv=$(id); if(cv && !cv.dataset.warned){ cv.dataset.warned=1; cv.insertAdjacentHTML('afterend','<p class="muted">Chart library did not load (offline). Values are still shown in the tables.</p>'); } return null; } if(charts[id]) charts[id].destroy(); charts[id]=new Chart($(id).getContext('2d'), cfg); return charts[id]; }
const gridColor = () => getComputedStyle(document.documentElement).getPropertyValue('--mist').trim();
const inkColor = () => getComputedStyle(document.documentElement).getPropertyValue('--slate').trim();
if(window.Chart){ Chart.defaults.font.family = "Calibri,'Segoe UI',Helvetica,Arial,sans-serif"; Chart.defaults.font.size=12; }


/* ---------------- plain language ------------------------------------------ */
const PLAIN = {
  flag: r => r.flag==='High' ? 'unusually high' : r.flag==='Low' ? 'unusually low' : 'within the normal range',
  count: r => `<b>${r.current}</b> interactions this year; a typical year has about <b>${fmt(r.median,0)}</b> and most years fall between ${fmt(r.p10,0)} and ${fmt(r.p90,0)}.`,
  pct: r => r.percentile>=90 ? `Higher than ${fmt(r.percentile,0)}% of past years — one of the highest on record.` : r.percentile<=10 ? `Lower than all but ${fmt(r.percentile,0)}% of past years.` : `Higher than ${fmt(r.percentile,0)}% of past years.`,
  bayes: (r,b) => b.p_tail<b.alpha ? `Given the recent trend, a count this high would be expected in fewer than 1 in ${Math.round(1/Math.max(b.p_tail,1e-4))} normal years — statistically unexpected.` : `Given the recent trend, a count like this would happen in roughly ${Math.round(b.p_tail*100)} of 100 normal years — not statistically unexpected.`,
  rate: rb => Math.abs(rb.rate_robust_anomaly)>1 ? `The rate per set moved the same way as the count, so this is not just a change in how much the fleet fished.` : `The rate per set barely changed, so part of the count change reflects how much the fleet fished.`,
  trend: rb => `Over the last ${rb.trend_years} years interactions have been ${rb.annual_pct_change>0?'rising':'falling'} by about ${fmt(Math.abs(rb.annual_pct_change),0)}% a year.`,
  space: rb => rb.centroid_shift_km>250 ? `Interactions happened about ${fmt(rb.centroid_shift_km,0)} km from where they usually do${rb.pct_outside_hist90>10?`, and ${fmt(rb.pct_outside_hist90,0)}% were outside the usual area`:''} — the fleet was fishing somewhere different.` : `Interactions happened close to where they usually do (${fmt(rb.centroid_shift_km,0)} km from the long-term centre).`,
  ocean: oc => { const x=oc.filter(o=>o.interaction_percentile>=90||o.interaction_percentile<=10); return x.length? `Ocean conditions at the interaction sets were unusual for ${x.map(o=>`${o.variable.toLowerCase()} (${o.interaction_percentile>=90?'unusually high':'unusually low'})`).join(', ')}.` : 'Ocean conditions at the interaction sets were within their usual range.'; }
};
const GLOSS = [
  ['Interaction','An observed capture, hooking or entanglement of a protected species, whether or not the animal survived.'],
  ['Flag','The tool\'s verdict for the year: High (unusually many), Typical, or Low (unusually few), judged against that species\' own past years.'],
  ['Typical year / median','The middle value of all past years — half the years were higher, half lower.'],
  ['Usual range (P10–P90)','The range that 80% of past years fell in. Values outside it are uncommon but not necessarily alarming.'],
  ['Percentile','What share of past years were lower than this year. 95th percentile means only 1 in 20 past years was higher.'],
  ['Robust anomaly','How far this year sits from a typical year, in units of the usual year-to-year variation. Above 2 is a long way out. Called "MAD-z" in the method notes.'],
  ['Statistical check (Bayesian)','The chance of seeing a count at least this high if this were a normal year, allowing for the recent trend. Under 5% counts as unexpected.'],
  ['Rate per set','Interactions divided by the number of observed sets, so years with more fishing are compared fairly.'],
  ['Trend','The average yearly change over the recent window (5 years for seabirds and sharks, 10 for turtles), from a statistical model that allows for effort.'],
  ['Centroid shift','How far the centre of this year\'s interaction locations moved from the long-term centre, in km.'],
  ['Outside the usual area','The share of this year\'s interactions that fell outside the region where 90% of past interactions occurred.'],
  ['Selection anomaly','The difference between ocean conditions where interactions happened and conditions across the whole fleet. Large values mean the fleet was fishing a different kind of water than usual.'],
  ['ITS (incidental take statement)','The number of takes the Biological Opinion anticipates. The tracker shows how much of the multi-year allowance has been used.'],
  ['Observer coverage','The share of fishing that had an observer aboard. Counts are scaled up by this to estimate the whole fleet.'],
  ['Causal branch','Which explanation the checklist points to: the fishery moved or changed gear, the count follows the trend, the ocean changed, a strong year class, or unclear.'],
  ['pipeline_output.json','The one file PIFSC produces each year. It contains only yearly summaries — no vessel or set-level records.']];
const COLHELP = {'Current':'This year\'s count','Mean':'Average of past years','Median':'Typical past year','P10':'Only 10% of past years were lower','P90':'Only 10% of past years were higher','Percentile':'Share of past years lower than this year','Robust anomaly':'Distance from a typical year in units of usual variation; ≥2 is far','N years':'Past years compared','Trend slope':'Average change per year (counts)','Gates':'Which of the three checks called this year unusual','Flag':'Verdict for the year','Rate / set':'Interactions per observed set','Rate %ile':'Share of past years with a lower rate','Rate robust anomaly':'Distance of the rate from a typical year','Annual % change':'Average yearly change over the trend window','Model':'Statistical model used for the trend','Model flag':'Whether the preferred model fitted','Trend yrs':'Years in the trend window','Centroid shift km':'How far the centre of interactions moved','% outside hist. 90%':'Share of interactions outside the usual area','Current interaction env.':'Ocean value at this year\'s interaction sets','Hist. median':'Typical past value at interaction sets','Abs. anomaly':'This year minus typical','Current fleet env.':'Ocean value across all fleet sets this year','Selection anomaly':'Interaction sets minus fleet sets','Selection shift':'Change in selection anomaly vs. typical','Interaction %ile':'Share of past years with a lower value at interaction sets','Selection %ile':'Share of past years with a lower selection anomaly'};
function renderHome(){ const T=D.table2_interactions, fl=T.filter(r=>r.flag==='High'), lo=T.filter(r=>r.flag==='Low'); const A=PSReport.aggregate(D); const its=(D.its||[]).filter(i=>i.annual_its);
  $('homeGlance').innerHTML = `<p style="margin:0 0 10px"><b>${D.meta.current_year} data</b> for ${T.length} species${(D.meta.mode||'test')==='test'?' <span class="chip">example data</span>':''}.</p>
    <p style="margin:0 0 10px">${fl.length? `<b>${fl.length} species ${fl.length===1?'is':'are'} flagged as unusually high</b> and need${fl.length===1?'s':''} a paragraph explaining why: ${fl.map(r=>`${r.species} (${r.current} this year, typically ${fmt(r.median,0)})`).join('; ')}.` : '<b>No species is flagged as unusually high this year.</b>'}</p>
    ${lo.length?`<p style="margin:0 0 10px">${lo.map(r=>r.species).join(', ')} ${lo.length===1?'is':'are'} unusually low.</p>`:''}
    <p style="margin:0 0 10px">${A.bigShift.length? `The fleet fished somewhere different for ${A.bigShift.map(r=>r.species.toLowerCase()).join(', ')} — interactions moved more than 250 km from their usual centre.` : 'Interactions happened close to their usual locations for every species.'}</p>
    ${its.length?`<p style="margin:0">Take limits: ${its.map(i=>`${i.species} has used ${fmt(i.pct_of_limit,0)}% of its ${i.window_years}-year allowance`).join('; ')}.${its.some(i=>i.alert)?' <b>At least one is at risk of being exceeded.</b>':''}</p>`:''}`;
  const sme = fl.filter(r=>{const a=SME_ANS[r.species_code]||{}; return a.q3===undefined||a.q9===undefined;});
  const steps=[['pipeline','Load this year\'s data',`Loaded: ${D.meta.current_year}${(D.meta.mode||'test')==='test'?' (example data)':''}`,true],
    ['anomaly','See which species look unusual',`${fl.length} flagged`,true],
    ['causal','Answer the expert questions for flagged species',sme.length?`${sme.length} still to answer`:'Done',!sme.length],
    ['tables','Check the report tables','Skim for anything that looks wrong',false],
    ['narrative','Edit the species paragraphs',`${(D.narratives||[]).length} drafts ready`,false],
    ['export','Create the report section','Word or Google Doc',false]];
  $('homeSteps').innerHTML=steps.map((st,i)=>`<button class="todo ${st[3]?'done':''}" onclick="goTab('${st[0]}')"><span class="k">${st[3]?'✓':i+1}</span><span><span class="t">${st[1]}</span><br><span class="d">${st[2]}</span></span><span class="s">open →</span></button>`).join(''); }
function renderGlossary(){ table('glossTable',[{h:'Term',k:'t',sp:1},{h:'What it means',k:'d'}], GLOSS.map(g=>({t:g[0],d:g[1]}))); }
function addColHelp(){ document.querySelectorAll('#t2 th,#t2b th,#t2c th').forEach(th=>{ const t=th.textContent.trim(); if(COLHELP[t]) th.title=COLHELP[t]; }); }

/* ---------------- 1 pipeline --------------------------------------------- */
function renderPipeline(){
  $('modeLabel').textContent = D.meta.mode || (D.meta.source_db ? 'test (SQLite)' : 'test'); $('yearLabel').textContent = D.meta.current_year; $('ruleLabel').textContent = D.meta.decision_rule;
  const yrs0=Object.values(D.series)[0].years; const fl0=D.table2_interactions.filter(r=>r.flag==='High');
  $('loadedPlain').innerHTML=`<p style="margin:0 0 8px">Data year <b>${D.meta.current_year}</b>, compared with <b>${yrs0.length-1}</b> earlier years (${yrs0[0]}–${yrs0[yrs0.length-2]}), for <b>${D.species.length}</b> species: ${D.species.map(x=>x.common).join(', ')}.</p><p style="margin:0 0 8px">${fl0.length? `<b>${fl0.map(r=>r.species).join(', ')}</b> ${fl0.length===1?'is':'are'} flagged as unusually high.`:'No species is flagged as unusually high.'}</p><p style="margin:0" class="muted">File produced ${D.meta.generated}. ${(D.meta.mode||'test')==='test'?'This is example data: real files from PIFSC replace it when loaded above.':''}</p>`;
  $('dataBadge').textContent = (D.meta.data_note||'').includes('Synthetic') || (D.meta.mode||'test')==='test' ? 'Example data' : 'This year\'s data';
  const flagged = D.table2_interactions.filter(r=>r.flag==='High').map(r=>r.species);
  $('runStatus').innerHTML = `<div class="stat">${D.table2_interactions.length}<small>SPECIES PROCESSED</small></div>
    <div class="stat" style="margin-top:12px">${flagged.length}<small>FLAGGED · ${flagged.join(', ')||'none'}</small></div>
    <p class="muted" style="margin:12px 0 0">Generated ${D.meta.generated}. α = ${D.meta.alpha}. ${D.meta.data_note||''}</p>`;
  $('provList').innerHTML = (D.provenance||[]).map(p=>`<div style="padding:5px 0;border-bottom:1px dashed var(--mist)"><b style="color:var(--navy)">${p.table_name}</b><br>${p.source} · <i>${p.confidentiality}</i></div>`).join('') || '<p>Provenance not supplied in this JSON.</p>';
  const yrs = Object.values(D.series)[0].years;
  $('runLog').textContent = [
    `[${D.meta.generated}] connect: ${D.meta.source_db||'LOTUS'}`,
    `read ps_interactions_annual → ${Object.keys(D.series).length} species × ${yrs.length} years (${yrs[0]}–${yrs[yrs.length-1]})`,
    `read ps_effort_annual → ${D.effort.length} rows; current-year observed sets ${D.effort[D.effort.length-1].observed_sets}, coverage ${fmt(D.effort[D.effort.length-1].coverage_rate*100,0)}%`,
    `compute Table 2 (MAD-z, percentile, Theil-Sen) → ok`,
    `compute Table 2b (Poisson/NB GLM with offset, centroid shift) → ${D.table2b_rate_spatial.filter(r=>/fallback|error/i.test(r.trend_model_flag)).length} fallback(s)`,
    `compute Table 2c (ocean selection anomaly) → ${D.table2c_ocean.length} rows`,
    `bayes: Gamma-Poisson predictive, NB–incomplete-beta identity validated`,
    `OR gate → High: ${flagged.join(', ')||'none'}`,
    `narratives: ${D.narratives.length} drafts (${[...new Set(D.narratives.map(n=>n.source))].join(', ')})`,
    `write pipeline_output.json → loaded in app`].join('\n');
  table('inputsTable',[{h:'Species',k:'common',sp:1},{h:'Code',k:'species_code'},{h:'Group',k:'group'},{h:'ESA status',k:'esa'},{h:'Sector',k:'sector'},
    {h:'Years',f:r=>`${D.series[r.species_code].years[0]}–${D.series[r.species_code].years.slice(-1)[0]}`},{h:'Current',num:1,f:r=>D.series[r.species_code].interactions.slice(-1)[0]},
    {h:'Ocean vars',num:1,f:r=>D.table2c_ocean.filter(o=>o.species_code===r.species_code).length}], D.species);
}
$('jsonFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const j=JSON.parse(rd.result); if(!j.table2_interactions) throw new Error('not a pipeline_output.json'); D=j; SEL=(D.table2_interactions.find(r=>r.flag==='High')||D.table2_interactions[0]).species_code; renderAll(); $('runLog').textContent += `\n[loaded] ${f.name} (${(f.size/1024).toFixed(0)} kB)`; goTab('home'); }catch(err){ alert('That file could not be read. It should be the pipeline_output.json file from PIFSC. ('+err.message+')'); } }; rd.readAsText(f); });
$('resetData').addEventListener('click', ()=>{ D=JSON.parse(JSON.stringify(EMBED)); SEL='LHT'; renderAll(); });

/* ---------------- 2 tables ----------------------------------------------- */
let renderTables=function(){
  const ref = $('showRef').checked;
  if(ref && D.reference){
    table('t2',[{h:'Species',k:'Species',sp:1},{h:'Current',k:'Current',num:1},{h:'Mean',k:'Mean',num:1,d:1},{h:'Median',k:'Median',num:1},{h:'P10',k:'P10',num:1,d:1},{h:'P90',k:'P90',num:1,d:1},{h:'Percentile',k:'Percentile',num:1,d:0},{h:'Robust anomaly',num:1,f:r=>sign(r['Robust Anomaly'])},{h:'N years',k:'N Years',num:1},{h:'Trend slope',k:'Trend Slope',num:1,d:1},{h:'Trend',k:'Trend'},{h:'Flag',f:r=>`<span class="chip flag-${r.Flag}">${r.Flag}</span>`},{h:'Explanation (reference)',k:'Spatial & Ocean Explanation'}], D.reference.interactions);
    table('t2b',[{h:'Species',k:'Species',sp:1},{h:'Interactions',k:'Current Interactions',num:1},{h:'Rate',k:'Current Rate',num:1,d:4},{h:'Hist. median rate',k:'Historical Median Rate',num:1,d:4},{h:'Hist. P90 rate',k:'Historical P90 Rate',num:1,d:4},{h:'Rate %ile',k:'Rate Percentile',num:1,d:0},{h:'Rate robust anomaly',num:1,f:r=>sign(r['Rate Robust Anomaly'])},{h:'Annual % change',num:1,f:r=>sign(r['Annual Percent Change'],1)},{h:'Model',k:'Trend Model Used'},{h:'Model flag',k:'Trend Model Flag'},{h:'Trend yrs',k:'Trend Years',num:1},{h:'Centroid shift km',k:'Centroid Shift km',num:1,d:0},{h:'% outside hist. 90%',k:'Pct Interactions Outside 90',num:1,d:1}], D.reference.rate_spatial);
    const rows=[]; let cur=null; D.reference.ocean.forEach(o=>{ if(o.Species!==cur){cur=o.Species; rows.push({__group:cur});} rows.push(o); });
    table('t2c',[{h:'Variable',k:'Variable',sp:1},{h:'Current interaction env.',k:'Current Interaction Environment',num:1,d:3},{h:'Hist. median',k:'Historical Interaction Median',num:1,d:3},{h:'Abs. anomaly',num:1,f:r=>sign(r['Absolute Anomaly'],3)},{h:'Current fleet env.',k:'Current Fleet Environment',num:1,d:3},{h:'Selection anomaly',num:1,f:r=>sign(r['Current Selection Anomaly'],3)},{h:'Selection shift',num:1,f:r=>sign(r['Selection Shift'],3)},{h:'Interaction %ile',k:'Interaction Percentile',num:1,d:0},{h:'Selection %ile',k:'Selection Percentile',num:1,d:0}], rows);
    return; }

  const txt=last.t.replace(/^Probable cause: /,'').replace(/ — escalate$/,'; escalate for review'); const old=n.causal_branch; n.causal_branch=txt;
  const ta=document.querySelector(`#narrCards textarea[data-code=${k}]`); if(ta && old && ta.value.includes(old)) ta.value=ta.value.replace(old, txt);
  const card=ta&&ta.closest('.panel'); if(card){ const p=card.querySelector('p.muted'); if(p) p.textContent='Likely explanation from the checklist: '+txt; } }

/* ---------------- 5 bayes ------------------------------------------------ */
function bayesCompute(k, alpha, weight, win, overdisp, count){ const s=D.series[k]; const h=s.interactions.slice(0,-1).slice(-win); const cur = count ?? s.interactions.slice(-1)[0];
  const {shape,rate}=gammaPrior(h,overdisp,weight); const p=nbTail(shape,rate,cur); return {shape,rate,cur,p,h,q05:nbQuantile(shape,rate,.05),q50:nbQuantile(shape,rate,.5),q95:nbQuantile(shape,rate,.95),flag:p<alpha}; }
function renderBayes(){ const sel=$('bSpecies'); if(!sel.options.length){ D.species.forEach(s=>sel.add(new Option(s.common,s.species_code))); sel.value=SEL; }
  const k=sel.value, alpha=+$('bAlpha').value, weight=+$('bWeight').value, win=+$('bWin').value, od=$('bOverdisp').checked;
  const nH=D.series[k].interactions.length-1; $('bWin').max=nH; $('bWinL').textContent= win>=nH?'all ('+nH+')':win; $('bAlphaL').textContent=alpha.toFixed(2); $('bWeightL').textContent=weight.toFixed(1);
  const cnt = $('bCount').value===''? null : +$('bCount').value; const r=bayesCompute(k,alpha,weight,Math.min(win,nH),od,cnt); $('bCountL').textContent=r.cur; $('bCount').placeholder=D.series[k].interactions.slice(-1)[0];
  $('bStats').innerHTML=`<div class="card"><div class="stat">${fmt(r.p*100,1)}%<small>CHANCE OF ${r.cur} OR MORE IN A NORMAL YEAR</small></div></div><div class="card"><div class="stat">${r.q05}–${r.q95}<small>EXPECTED RANGE THIS YEAR</small></div></div><div class="card tech"><div class="stat">${fmt(r.shape,2)} / ${fmt(r.rate,3)}<small>PRIOR SHAPE / RATE</small></div></div><div class="card"><div class="stat" style="color:${r.flag?C.orange:C.navy}">${r.flag?'Unexpected':'Not unexpected'}<small>AT CUT-OFF ${alpha.toFixed(2)}</small></div></div>`;
  const kmax=Math.max(r.q95*1.6, r.cur*1.3, 10)|0; const step=Math.max(1,Math.round(kmax/160)); const xs=[]; for(let x=0;x<=kmax;x+=step) xs.push(x);
  const pm=xs.map(x=>{ let s=0; for(let j=x;j<x+step;j++) s+=nbPMF(r.shape,r.rate,j); return s; });
  chart('bayesChart',{type:'bar',data:{labels:xs,datasets:[{label:'Posterior predictive probability',data:pm,backgroundColor:xs.map(x=>x>=r.cur?'rgba(241,143,1,.75)':'rgba(6,90,130,.55)'),borderWidth:0,barPercentage:1,categoryPercentage:.95}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>`Count ${i[0].label}${step>1?'–'+(+i[0].label+step-1):''}`,label:i=>'p = '+i.raw.toFixed(4)}}},
      scales:{x:{type:'category',grid:{display:false},ticks:{color:inkColor(),maxTicksLimit:14},title:{display:true,text:'Interactions in the current year'+(cnt!==null?' (test count '+r.cur+')':''),color:inkColor()}},y:{grid:{color:gridColor()},ticks:{color:inkColor()},title:{display:true,text:'Probability',color:inkColor()}}}}});
  // calibration table
  const alphas=[0.01,0.025,0.05,0.10,0.15,0.20]; const rows=alphas.map(a=>{ let cur=0, hist=0, n=0; D.species.forEach(sp=>{ const ser=D.series[sp.species_code].interactions; const rr=bayesCompute(sp.species_code,a,weight,Math.min(win,nH),od,null); if(rr.flag) cur++;
      for(let t=6;t<ser.length-1;t++){ const h=ser.slice(Math.max(0,t-win),t); const pr=gammaPrior(h,od,weight); if(nbTail(pr.shape,pr.rate,ser[t])<a) hist++; n++; } }); return {alpha:a, cur, rate:100*hist/n, n}; });
  table('calib',[{h:'α',k:'alpha',num:1,d:3},{h:'Species flagged now',k:'cur',num:1},{h:'Historical flag rate %',k:'rate',num:1,d:1},{h:'Species-years tested',k:'n',num:1}], rows); }
['bSpecies','bAlpha','bWeight','bWin','bOverdisp','bCount'].forEach(id=>$(id).addEventListener('input',renderBayes));

/* ---------------- 6 agent ------------------------------------------------ */
const PROFILES=['Industrial','Market-led','Balanced','Precautionary','Zero-tolerance'];
function renderAgent(init){ const sel=$('aSpecies'); if(!sel.options.length){ D.species.forEach(s=>sel.add(new Option(s.common,s.species_code))); sel.value=SEL; init=true; }
  const k=sel.value; const sp=byCode(D.species,k); const s=D.series[k]; const e=D.effort[D.effort.length-1]; const its=byCode(D.its,k)||{}; const r=byCode(D.table2_interactions,k); const b=byCode(D.bayes,k); const rb=byCode(D.table2b_rate_spatial,k);
  const demo=(D.context.demographics||[]).filter(x=>x.species_code===k && /juv/i.test(x.size_class));
  if(init){ $('aObs').value=s.interactions.slice(-1)[0]; $('aCov').value= sp.sector==='SSLL'?1:e.coverage_rate; $('aIts').value= its.annual_its || Math.round(r.p90*(sp.sector==='SSLL'?1:1/e.coverage_rate)*1.2); $('aJuv').value= demo.length? demo[0].pct_of_takes/100 : 0.3; }
  const obs=+$('aObs').value, cov=+$('aCov').value, itsA=+$('aIts').value, betaOn=$('aBeta').checked, betaV=+$('aBetaV').value, env=+$('aEnv').value, gear=+$('aGear').value, juv=+$('aJuv').value, risk=+$('aRisk').value, trig=+$('aTrig').value;
  $('aObsL').textContent=obs; $('aCovL').textContent=fmt(cov*100,0)+'%'; $('aItsL').textContent=itsA; $('aBetaL').textContent=(betaOn?betaV:1).toFixed(1)+'×'; $('aEnvL').textContent=env.toFixed(2); $('aGearL').textContent=gear.toFixed(2)+'×'; $('aJuvL').textContent=fmt(juv*100,0)+'%'; $('aRiskL').textContent=PROFILES[Math.min(Math.floor((risk-1)/2),4)]; $('aTrigL').textContent=fmt(trig*100,0)+'%';
  // --- LOTUS anchor and bounded adjustment
  const expanded = obs / Math.max(cov,0.05);
  const oc=D.table2c_ocean.filter(o=>o.species_code===k); const selAnom = oc.length? mean(oc.map(o=>(o.selection_percentile-50)/50)) : 0;   // −1..1
  const envF = 1 + Math.max(-0.4, Math.min(0.4, env*selAnom*0.4));
  const betaF = betaOn? Math.min(betaV,2.5) : 1;
  const gearF = Math.max(0.7, Math.min(1.3, gear));
  const combined = Math.max(0.6, Math.min(3.0, betaF*envF*gearF));       // single bounded factor — no independent compounding
  const mu = expanded*combined;
  const hRates=s.interactions.slice(0,-1); const cv = Math.sqrt(variance(hRates))/Math.max(mean(hRates),1e-9);
  const cvUse=Math.max(0.15, Math.min(1.2, cv)); const shape=1/(cvUse*cvUse), scale=mu/shape;
  const pex = 1 - gammainc(shape, itsA/scale);
  const juvW = 1 + 0.5*juv;                                                 // demographic weight: juveniles pull the inflection earlier (illustrative)
  const v=5+risk*2, x0=Math.max(0.15,(85-risk*5)/100/juvW), L=2000+risk*1000; const penalty=L/(1+Math.exp(-v*(pex-x0)));
  const buffer=Math.min(0.55, 0.2*(1+Math.log(1+ (selAnom>0.5?1.2:0.3)*2.7)));
  let state, title, sub; if(pex>trig){ state='esc'; title='Escalate for Council / Plan Team review'; sub=`P(expanded take > ITS) = ${fmt(pex*100,0)}% exceeds the ${fmt(trig*100,0)}% trigger.`; }
  else if(mu>itsA*(1-buffer) || r.flag==='High'){ state='watch'; title='Enhanced monitoring'; sub= r.flag==='High' ? 'Anomaly gate fired this year; calibrated take remains under the ITS.' : `Calibrated take ${fmt(mu,0)} is inside the ${fmt(buffer*100,0)}% uncertainty buffer below the ITS.`; }
  else { state='ok'; title='Within expectation'; sub=`Calibrated take ${fmt(mu,0)} against an annual ITS of ${itsA}.`; }
  const bn=$('aBanner'); bn.className='banner '+state; $('aTitle').textContent=title; $('aSub').textContent=sub; $('aPex').innerHTML=`${fmt(pex*100,1)}%<small>P(expanded take &gt; annual ITS)</small>`;
  $('aAudit').innerHTML=`<table style="min-width:0"><tr><td>Observed (LOTUS)</td><td class="num">${obs}</td></tr><tr><td>÷ observer coverage ${fmt(cov*100,0)}%</td><td class="num">= ${fmt(expanded,1)} expanded</td></tr>
    <tr><td>β reporting-bias scaler (cap 2.5)</td><td class="num">× ${betaF.toFixed(2)}</td></tr><tr><td>Environment (selection anomaly ${sign(selAnom,2)}, cap ±40%)</td><td class="num">× ${envF.toFixed(2)}</td></tr><tr><td>Gear / hook position (cap ±30%)</td><td class="num">× ${gearF.toFixed(2)}</td></tr>
    <tr><td><b>Combined factor (bounded 0.6–3.0)</b></td><td class="num"><b>× ${combined.toFixed(2)}</b></td></tr><tr><td><b>Calibrated take μ</b></td><td class="num"><b>${fmt(mu,1)}</b></td></tr>
    <tr><td>Gamma CV from history (bounded 0.15–1.2)</td><td class="num">${cvUse.toFixed(2)}</td></tr><tr><td>Demographic weight (juvenile share)</td><td class="num">÷ ${juvW.toFixed(2)} on inflection → ${fmt(x0*100,0)}%</td></tr><tr><td>Sigmoid penalty at P = ${fmt(pex*100,0)}%</td><td class="num">${fmt(penalty,0)} of ${L}</td></tr></table>`;
  // take distribution
  const xmax=Math.max(itsA*1.4, mu*2.5); const xs=[], ys=[]; for(let i=0;i<=120;i++){ const x=xmax*i/120; xs.push(Math.round(x)); ys.push(x<=0?0:Math.exp((shape-1)*Math.log(x)-x/scale-lgamma(shape)-shape*Math.log(scale))); }
  chart('agentChart',{type:'line',data:{labels:xs,datasets:[{label:'Calibrated take density',data:ys,borderColor:C.ocean,backgroundColor:'rgba(6,90,130,.18)',fill:true,pointRadius:0,borderWidth:2,tension:.3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{grid:{display:false},ticks:{color:inkColor(),maxTicksLimit:8},title:{display:true,text:'Expanded interactions',color:inkColor()}},y:{display:false}}},
    plugins:[{id:'itsLine',afterDraw:c=>{ const x=c.scales.x.getPixelForValue(xs.findIndex(v=>v>=itsA)); const ctx=c.ctx; ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle=C.orange; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,c.scales.y.top); ctx.lineTo(x,c.scales.y.bottom); ctx.stroke(); ctx.fillStyle=C.orange; ctx.font='bold 10px Calibri,sans-serif'; ctx.textAlign='center'; ctx.fillText('ITS',x,c.scales.y.top+10); ctx.restore(); }}]});
  // ITS running sum
  const win=its.window_years||5, w0=its.window_start||(D.meta.current_year-win+1); const wy=s.years.map((y,i)=>({y,i})).filter(o=>o.y>=w0&&o.y<w0+win);
  const covs=D.effort.reduce((m,e)=>(m[e.year]=e.coverage_rate,m),{}); const ex=wy.map(o=>s.interactions[o.i]/(sp.sector==='SSLL'?1:(covs[o.y]||cov))); let cum=0; const cums=ex.map(v=>cum+=v); const limit=itsA*win;
  chart('itsChart',{type:'bar',data:{labels:wy.map(o=>o.y),datasets:[{type:'line',label:'Cumulative',data:cums,borderColor:C.navy,pointBackgroundColor:C.navy,borderWidth:2,yAxisID:'y'},{label:'Expanded take',data:ex,backgroundColor:C.teal,yAxisID:'y'},{type:'line',label:'Window limit',data:wy.map(()=>limit),borderColor:C.orange,borderDash:[5,4],pointRadius:0,borderWidth:2,yAxisID:'y'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:inkColor()}}},scales:{x:{grid:{display:false},ticks:{color:inkColor()}},y:{beginAtZero:true,grid:{color:gridColor()},ticks:{color:inkColor()}}}}});
  $('itsNote').textContent = its.annual_its ? `${its.authority}: ${fmt(cum,0)} of ${limit} (${fmt(100*cum/limit,0)}%) after ${wy.length} of ${win} years; P(exceed before close) = ${fmt(its.p_exceed_before_close,3)}${its.alert?' — ALERT (>0.25)':''}.` : `${its.authority||'No ITS on file'} — window shown with the illustrative annual value above.`;
  // penalty curve
  const px=[], py=[]; for(let p=0;p<=1.0001;p+=0.02){ px.push(Math.round(p*100)); py.push(L - L/(1+Math.exp(-v*(p-x0)))); }
  chart('penaltyChart',{type:'line',data:{labels:px,datasets:[{label:'Utility after demographic penalty',data:py,borderColor:'#B23A2A',borderWidth:2.5,pointRadius:0,tension:.3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:inkColor(),maxTicksLimit:6},title:{display:true,text:'Exceedance probability (%)',color:inkColor()}},y:{grid:{color:gridColor()},ticks:{color:inkColor()},title:{display:true,text:'Decision utility',color:inkColor()}}}},
    plugins:[{id:'cliff',afterDraw:c=>{ const x=c.scales.x.getPixelForValue(Math.round(x0*50)); const ctx=c.ctx; ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle=C.orange; ctx.beginPath(); ctx.moveTo(x,c.scales.y.top); ctx.lineTo(x,c.scales.y.bottom); ctx.stroke(); ctx.fillStyle=C.orange; ctx.font='bold 10px Calibri,sans-serif'; ctx.textAlign='right'; ctx.fillText('inflection '+Math.round(x0*100)+'%',x-4,c.scales.y.top+12); ctx.restore(); }}]});
}
$('aSpecies').addEventListener('change',()=>renderAgent(true));
['aObs','aCov','aIts','aBeta','aBetaV','aEnv','aGear','aJuv','aRisk','aTrig'].forEach(id=>$(id).addEventListener('input',()=>renderAgent(false)));

/* ---------------- 7 narrative -------------------------------------------- */
function renderNarrative(){ const order={High:0,Low:1,Typical:2}; $('narrCards').innerHTML=[...(D.narratives||[])].sort((a,b)=>order[a.flag]-order[b.flag]).map(n=>`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><h4 style="margin:0">${n.species}</h4><span class="chip flag-${n.flag}">${n.flag}</span></div>
  ${n.causal_branch?`<p class="muted" style="margin:0 0 8px">Likely explanation from the checklist: ${n.causal_branch}</p>`:''}<textarea data-code="${n.species_code}">${n.narrative}</textarea><p class="muted" style="margin:8px 0 0">Source: ${n.source}. ${n.provenance||''}</p></div>`).join(''); }
$('mdExport').addEventListener('click',()=>{ const md=[`# Protected species interactions — ${D.meta.current_year}\n`,...[...document.querySelectorAll('#narrCards textarea')].map(t=>`## ${spName(t.dataset.code)}\n\n${t.value}\n`)].join('\n'); download(`ps_narratives_${D.meta.current_year}.md`, md, 'text/markdown'); });


/* ---------------- 8 export ----------------------------------------------- */
const editedNarratives = () => { const o={}; document.querySelectorAll('#narrCards textarea').forEach(t=>o[t.dataset.code]=t.value); return o; };
function renderExport(){ const A=PSReport.aggregate(D);
  $('aggFindings').innerHTML='<ul style="margin:0;padding-left:20px;line-height:1.55">'+A.findings.map(t=>`<li style="margin:6px 0">${t}</li>`).join('')+'</ul>';
  table('aggTable',[{h:'Species',k:'species',sp:1},{h:'Flag',f:r=>`<span class="chip flag-${r.flag}">${r.flag}</span>`},{h:'Gates',k:'gates'},{h:'Count (%ile)',k:'count'},{h:'Rate anomaly',k:'rate'},{h:'Trend',k:'trend'},{h:'Centroid shift',k:'shift'},{h:'Predictive 90%',k:'pred'},{h:'Ocean extremes',k:'ocean'},{h:'ITS window',k:'its'},{h:'Causal branch',k:'branch'}], A.crossTable);
  table('aggOcean',[{h:'Variable',k:'variable',sp:1},{h:'Mean %ile',k:'meanPct',num:1,d:0},{h:'High',f:o=>`${o.hi} of ${o.n}`},{h:'Low',f:o=>`${o.lo} of ${o.n}`},{h:'Extreme selection',k:'selExtreme',num:1},{h:'Reading',f:o=>o.direction==='mixed'?'no coherent signal':o.direction+' across the fishery'}], A.ocean);
  const blocks=PSReport.buildSection(D, editedNarratives()); $('aggOutline').innerHTML=blocks.filter(b=>/^h[123]$/.test(b.type)).map(b=>`<div style="padding:2px 0 2px ${(+b.type[1]-1)*16}px;${b.type==='h1'?'font-weight:700;color:var(--navy)':''}">${b.text}</div>`).join(''); }
function exportStatus(msg, kind){ const el=$('exportStatus'); el.style.display='block'; el.innerHTML=`<p style="margin:0;color:${kind==='err'?'#B23A2A':'var(--navy)'}">${msg}</p>`; }
function loadScript(src){ return new Promise((res,rej)=>{ if(window.docx) return res(); const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('could not load '+src)); document.head.appendChild(sc); }); }
const docTitle = () => `SAFE 3.3.2 Protected Species Section — ${D.meta.current_year}`;
async function exportWord(){ try{ exportStatus('Building the Word document…'); await loadScript('https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js');
    const blocks=PSReport.buildSection(D, editedNarratives()); const doc=PSReport.toDocx(blocks, window.docx, docTitle()); const blob=await window.docx.Packer.toBlob(doc); const filename=`SAFE_3.3.2_Protected_Species_${D.meta.current_year}.docx`;
    const dl = (typeof claude!=='undefined' && claude.use) ? await claude.use('downloads') : null;
    if(dl){ await dl.save({filename, data:blob}); exportStatus(`Saved ${filename} (${(blob.size/1024).toFixed(0)} kB).`); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); exportStatus(`Downloaded ${filename}.`); }
  }catch(e){ const code=e&&e.code; exportStatus(code==='declined'?'Save cancelled.': code==='unavailable'||code==='not_granted'?'Saving files is not available in this view — open the app in claude.ai, or use the Quarto docx render.':'Word export failed: '+(e.message||e), code==='declined'?'':'err'); } }
async function exportGDoc(){ try{ exportStatus('Creating the Google Doc in your Drive…');
    const mcp = (typeof claude!=='undefined' && claude.use) ? await claude.use('mcp') : null;
    if(!mcp){ exportStatus('Google Drive is not reachable from this view. Open the published app in claude.ai with the Google Drive connector, or create the Word document and upload it to Drive (it opens as a Google Doc).','err'); return; }
    const html=PSReport.toHTML(PSReport.buildSection(D, editedNarratives()), docTitle());
    const res=await mcp.callTool('Google Drive','create_file',{title:docTitle(), textContent:html, contentMimeType:'text/html'});
    const p=res.payload||{}; if(p.viewUrl) exportStatus(`Created <b>${p.title||docTitle()}</b> as a Google Doc — <a href="${p.viewUrl}" target="_blank" rel="noopener">open it</a>.`); else exportStatus('Google Doc created (no link returned). Check your Drive root.');
  }catch(e){ const c=e&&e.code; const m={needs_reauth:'Google Drive needs to be reconnected in claude.ai settings.',server_not_connected:'Google Drive is not connected to your claude.ai account. Connect it, then try again.',blocked_by_policy:'Your organization does not allow this connector from published pages.',tool_error:'Google Drive reported an error: '+(e.message||'')}[c]; exportStatus(m||('Could not create the Google Doc: '+(e.message||e)),'err'); } }
$('btnWord').addEventListener('click', exportWord); $('btnGDoc').addEventListener('click', exportGDoc);

/* ---------------- 9 docs ------------------------------------------------- */
function renderDocs(){ const items=['Environmental-sensitivity coefficient and the ±40% cap (Table 2c selection anomaly → take adjustment).','β reporting-bias scaler: is 1.3× defensible for unobserved-release under-reporting, by sector?','Gear / hook-position multipliers and the leader-type and bait-type effects.','Juvenile share of take by species and the demographic penalty weight.','ITS values, window start years and whether the tracker should use expanded or observed take.','Gate thresholds (MAD-z ≥ 2, percentile ≥ 90, α = 0.05) via SDM swing-weighting with the Plan Team.','Trend windows (5 vs 10 years) and the NB dispersion switch at 1.5.','Interpretation of the ocean selection anomaly as evidence of a distribution shift vs. catchability change.','LOTUS view definitions and confirmation that no set-level records are exported.','LLM endpoint approval (FedRAMP / internal) before enabling the narrative chunk.'];
  $('smeList').innerHTML=items.map(t=>`<div class="check"><span class="box"></span><span>${t}</span></div>`).join(''); }

function renderAll(){ renderPipeline(); renderTables(); renderNarrative(); renderDocs(); renderGlossary(); renderHome(); ['causalSpecies','bSpecies','aSpecies'].forEach(id=>$(id).innerHTML=''); }
renderAll();
